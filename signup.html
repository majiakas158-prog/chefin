<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CheafIn | Create Account</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/signup.css">

</head>

<body>

<div class="container">

    <!-- Left Side -->

    <div class="left">

        <img src="images/logo.png" class="logo" alt="Logo">

        <h1>CheafIn</h1>

        <p class="tagline">

            Connecting Restaurants with Professional Chefs

        </p>

        <img src="images/background.jpg"
             class="illustration"
             alt="Chef">

    </div>

    <!-- Right Side -->

    <div class="right">

        <div class="signup-box">

            <h2>Create Account</h2>

            <p>

                Join CheafIn and start your journey today.

            </p>

            <!-- Role Selection -->

            <h4>Select Your Role</h4>

            <div class="role-selection">

                <button
                    class="role-btn active"
                    id="chefBtn"
                    type="button">

                    👨‍🍳 Chef

                </button>

                <button
                    class="role-btn"
                    id="restaurantBtn"
                    type="button">

                    🏢 Restaurant

                </button>

            </div>

            <!-- Registration Form -->

            <form id="signupForm">

                <!-- Full Name -->

                <div class="input-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        placeholder="Enter your full name"
                        required>

                </div>

                <!-- Email -->

                <div class="input-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        placeholder="Enter your email"
                        required>

                </div>

                <!-- Phone -->

                <div class="input-group">

                    <label>Phone Number</label>

                    <input
                        type="tel"
                        placeholder="Enter your phone number"
                        required>

                </div>

                <!-- Password -->

                <div class="input-group">

                    <label>Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Create password"
                            required>

                        <i class="fa-solid fa-eye" id="togglePassword"></i>

                    </div>

                </div>

                <!-- Confirm Password -->

                <div class="input-group">

                    <label>Confirm Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm password"
                            required>

                        <i class="fa-solid fa-eye" id="toggleConfirmPassword"></i>

                    </div>

                </div>

                <!-- Chef Fields -->

                <div id="chefFields">

                    <div class="input-group">

                        <label>Years of Experience</label>

                        <input
                            type="number"
                            placeholder="e.g. 5">

                    </div>

                    <div class="input-group">

                        <label>Specialization</label>

                        <input
                            type="text"
                            placeholder="Indian, Chinese, Italian...">

                    </div>

                    <div class="input-group">

                        <label>Preferred Job Location</label>

                        <input
                            type="text"
                            placeholder="City">

                    </div>

                </div>

                <!-- Restaurant Fields -->

                <div id="restaurantFields" style="display:none;">

                    <div class="input-group">

                        <label>Restaurant Name</label>

                        <input
                            type="text"
                            placeholder="Restaurant Name">

                    </div>

                    <div class="input-group">

                        <label>Restaurant Address</label>

                        <textarea
                            rows="3"
                            placeholder="Restaurant Address"></textarea>

                    </div>

                    <div class="input-group">

                        <label>City</label>

                        <input
                            type="text"
                            placeholder="City">

                    </div>

                </div>

                <!-- Terms -->

                <div class="terms">

                    <label>

                        <input type="checkbox" required>

                        I agree to the Terms & Conditions

                    </label>

                </div>

                <!-- Button -->

                <button
                    type="submit"
                    class="signup-btn">

                    Create Account

                </button>

            </form>

            <div class="bottom">

                Already have an account?

                <a href="signin.html">

                    Sign In

                </a>

            </div>

        </div>

    </div>

</div>

<script src="js/signup.js"></script>

</body>

</html>
